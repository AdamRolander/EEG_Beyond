# ============================================================
# Real-Time EEG Imagery Neurofeedback — default session config
# ============================================================
# All tunable parameters live here. Code reads from this file
# (or an override file) and validates via Pydantic models in
# src/config_session.py.
# ============================================================

subject:
  id: "S001"
  notes: ""

# ─── EEG ingest ──────────────────────────────────────────────
# Custom 16-ch headset over visual cortex.
# Amplifier: OpenBCI Cyton+Daisy, 16 channels @ 250 Hz.
# Reference: CPz. Ground (BIAS): O1.
#   → O1 is electrically tied to amp ground and is NOT one of the
#     16 recorded channels. The 16 channels are other occipital
#     and parietal sites.
# Software: OpenBCI GUI with LSL networking enabled.
#   GUI default outlet: name="obci_eeg1", type="EEG".
eeg:
  # Substring match against LSL stream name; "" = first EEG stream found.
  stream_name_hint: "obci_eeg1"
  # Currently 14 active channels. Daisy pins 7+8 are not connected yet
  # (Cyton+Daisy has 16 input pins; 2 electrodes are wired as reference
  # (CPz → SRB) and ground (O1 → BIAS), leaving 14 of 16 pins for recording).
  # Bump back to 16 once the two extra electrodes arrive.
  expected_n_channels: 14
  # OpenBCI Cyton+Daisy fixed at 250 Hz.
  expected_sample_rate: 250
  # 240 s holds the entire ICA calibration window (~3 min) in the ring
  # buffer; cheap (~6 MB RAM at 16 ch × 250 Hz).
  buffer_seconds: 240
  # If true, use the simulated inlet instead of LSL (for development).
  simulate: false
  # Channel label override. Maps Cyton+Daisy pin order to 10-10 system
  # names (per Yann's wiring legend). The OpenBCI GUI streams generic
  # "Ch1".."Ch14" names — these get overridden at session startup so
  # MNE/ICLabel can resolve scalp positions from the standard_1005 montage.
  # Reference: CPz (wired to SRB1).  Ground/bias: O1.
  # NOTE: 14 channels here matches expected_n_channels above. When the two
  # additional electrodes arrive and are wired into Daisy pins 7 + 8, add
  # their names below and bump expected_n_channels back to 16.
  channel_labels:
    # ── Cyton (channels 1-8) ──
    - "PO4" # ch 1  (Cyton pin 1)
    - "PO3" # ch 2  (Cyton pin 2)
    - "PO6" # ch 3  (Cyton pin 3)
    - "PO5" # ch 4  (Cyton pin 4)
    - "PO7" # ch 5  (Cyton pin 5)
    - "PO8" # ch 6  (Cyton pin 6)
    - "Oz" # ch 7  (Cyton pin 7)
    - "O2" # ch 8  (Cyton pin 8)
    # ── Daisy (channels 9-14; pins 7 + 8 unconnected) ──
    - "P3" # ch 9   (Daisy pin 1)
    - "P1" # ch 10  (Daisy pin 2)
    - "Pz" # ch 11  (Daisy pin 3)
    - "P2" # ch 12  (Daisy pin 4)
    - "P4" # ch 13  (Daisy pin 5)
    - "POz" # ch 14  (Daisy pin 6)

# ─── Preprocessing ───────────────────────────────────────────
preprocessing:
  bandpass_low_hz: 1.0
  bandpass_high_hz: 40.0
  # 60 Hz for US line noise; add 50.0 if running in EU.
  notch_freqs_hz: [60.0]
  car: true
  ica:
    enable: true
    method: "picard"
    # null = number of components equals number of channels.
    n_components: null
    # ICLabel auto-classification of components into brain/eye/muscle/heart/etc.
    # Requires resolvable scalp positions for every channel. The 16-channel
    # montage in eeg.channel_labels uses 10-10 names that resolve in MNE's
    # `standard_1005` montage, so this should work. If ICA Fit returns
    # `icalabel_error` in the response, set this to false and inspect
    # components offline in MNE.
    auto_label: true
    # Used only when auto_label is true:
    auto_label_threshold: 0.7
    reject_categories:
      - "muscle artifact"
      - "eye blink"
      - "heart beat"
      - "line noise"
      - "channel noise"
  # Peak-to-peak threshold (microvolts) on the cleaned epoch.
  artifact_pp_threshold_uv: 150.0

# ─── Stimulus classes ────────────────────────────────────────
classes:
  cat:
    code: 100
    audio_file: "cat.wav"
    exemplars:
      - "cat/1.png"
      - "cat/2.png"
      - "cat/3.png"
      - "cat/4.png"
      - "cat/5.png"
  wrench:
    code: 101
    audio_file: "wrench.wav"
    exemplars:
      - "wrench/1.png"
      - "wrench/2.png"
      - "wrench/3.png"
      - "wrench/4.png"
      - "wrench/5.png"
  house:
    code: 102
    audio_file: "house.wav"
    exemplars:
      - "house/1.png"
      - "house/2.png"
      - "house/3.png"
      - "house/4.png"
      - "house/5.png"

# ─── Phase parameters ────────────────────────────────────────
phases:
  ica_calibration:
    eyes_open_seconds: 60
    eyes_closed_seconds: 60
    blink_seconds: 30
    jaw_clench_seconds: 30

  perception_block:
    trials_per_class: 30
    trials_per_block: 9 # 3/class
    perception_duration_ms: 4000
    fixation_duration_ms: 1000
    rest_duration_ms: 2000

  acquisition:
    trials_per_block: 9 # 3/class, sampled without replacement
    threshold_high_quality_per_class: 30
    block_likert_min: 4
    exclude_flagged_bad: true
    upweight_flagged_best: 2.0
    # Hard cap so the phase doesn't run forever if subject can't reach threshold.
    max_blocks: 25

  feedback:
    n_blocks: 6 # 9 trials/block × 6 blocks = 54 trials
    n_trials_per_block: 9

  probe:
    n_blocks: 6 # held-out evaluation, headline H1
    n_trials_per_block: 9

# ─── Trial timing (used in acquisition / feedback / probe) ────
trial:
  fixation_duration_ms: 1000
  audio_cue_duration_ms: 700
  imagery_duration_ms: 4000
  rest_duration_ms: 2000

# ─── Block-opening anchor ────────────────────────────────────
anchor:
  enable: true
  image_duration_ms: 2000
  blank_between_ms: 500
  # If true, exemplar index advances per block (block N → exemplar (N mod 5)).
  rotate_exemplar_index: true

# ─── Card construction & scoring ─────────────────────────────
card:
  feature_weights:
    riemannian: 0.7
    rqa: 0.3
    embedding: 0.0 # V1: encoder disabled. V2 will set this.
  # σ for s_riem = exp(-d / σ): "median" = median training distance.
  riemannian_sigma_method: "median"
  rqa_phase_space_dim: 3
  # null = autodetect τ from first zero-crossing of autocorrelation.
  rqa_tau: null
  rqa_recurrence_threshold_pct: 0.1
  # Imagery window relative to IMAGERY_ONSET marker, in seconds.
  imagery_epoch_start_s: 0.0
  imagery_epoch_end_s: 4.0

# ─── Output ──────────────────────────────────────────────────
output:
  data_root: "data"
