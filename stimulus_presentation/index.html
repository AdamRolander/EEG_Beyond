<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EEG Stimulus Platform - HTTP/LSL Version</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Courier New', monospace;
            background: #808080;
            overflow: hidden;
        }
        
        #control-panel {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #1a1a1a;
            color: #e0e0e0;
            padding: 30px;
            border: 1px solid #404040;
            z-index: 1000;
            min-width: 420px;
            max-height: 90vh;
            overflow-y: auto;
        }
        
        #control-panel h1 {
            font-size: 16px;
            margin-bottom: 20px;
            border-bottom: 1px solid #404040;
            padding-bottom: 10px;
        }
        
        #control-panel h2 {
            font-size: 13px;
            margin: 15px 0 10px 0;
            color: #a0a0a0;
        }
        
        .control-group {
            margin-bottom: 12px;
        }
        
        label {
            display: block;
            font-size: 11px;
            margin-bottom: 4px;
            color: #808080;
        }
        
        select, input[type="number"] {
            width: 100%;
            padding: 8px;
            background: #2a2a2a;
            border: 1px solid #404040;
            color: #e0e0e0;
            font-family: inherit;
            font-size: 13px;
        }
        
        input[type="checkbox"] {
            margin-right: 8px;
        }
        
        button {
            width: 100%;
            padding: 12px;
            margin-top: 8px;
            background: #2a5a2a;
            border: 1px solid #3a7a3a;
            color: #e0e0e0;
            font-family: inherit;
            font-size: 13px;
            cursor: pointer;
        }
        
        button:hover {
            background: #3a7a3a;
        }
        
        button:disabled {
            background: #404040;
            cursor: not-allowed;
        }
        
        button.secondary {
            background: #2a2a5a;
            border-color: #3a3a7a;
        }
        
        button.secondary:hover {
            background: #3a3a7a;
        }
        
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        
        #status-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.9);
            color: #e0e0e0;
            padding: 10px 20px;
            font-size: 12px;
            display: none;
            z-index: 100;
        }
        
        #status-bar .info {
            display: inline-block;
            margin-right: 30px;
        }
        
        #status-bar .progress-bar {
            height: 4px;
            background: #333;
            margin-top: 8px;
        }
        
        #status-bar .progress-fill {
            height: 100%;
            background: #4a8a4a;
            width: 0%;
            transition: width 0.3s;
        }
        
        .lsl-connected { color: #00ff00; }
        .lsl-error { color: #ff0000; }
        
        #event-log {
            position: fixed;
            right: 0;
            top: 0;
            width: 320px;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            color: #00ff00;
            font-size: 10px;
            padding: 10px;
            overflow-y: auto;
            z-index: 500;
            display: none;
        }
        
        #event-log.visible {
            display: block;
        }
        
        .log-entry {
            margin-bottom: 2px;
            white-space: nowrap;
        }
        
        .log-onset { color: #00ff00; }
        .log-offset { color: #ff9900; }
        .log-system { color: #666666; }
        
        .hidden { display: none !important; }
        
        .info-text {
            font-size: 10px;
            color: #606060;
            margin-top: 15px;
            line-height: 1.5;
        }
        
        .connection-status {
            padding: 10px;
            margin: 10px 0;
            border-radius: 4px;
            font-size: 11px;
        }
        
        .status-ok {
            background: #2a4a2a;
            color: #00ff00;
        }
        
        .status-error {
            background: #4a2a2a;
            color: #ff6666;
        }
        
        #vr-button {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            padding: 15px 30px;
            background: #2a2a5a;
            border: 1px solid #4a4a8a;
            color: #e0e0e0;
            font-family: monospace;
            font-size: 14px;
            cursor: pointer;
            z-index: 1000;
            display: none;
        }
        
        #vr-button:hover {
            background: #3a3a7a;
        }
        
        #vr-button:disabled {
            background: #404040;
            cursor: not-allowed;
        }
        
        #vr-status {
            position: fixed;
            bottom: 70px;
            left: 50%;
            transform: translateX(-50%);
            padding: 8px 16px;
            background: rgba(0,0,0,0.8);
            color: #ffcc00;
            font-family: monospace;
            font-size: 11px;
            z-index: 1000;
            display: none;
            border-radius: 4px;
        }
    </style>
</head>
<body>
    <div id="control-panel">
        <h1>EEG STIMULUS PLATFORM v2.1</h1>
        <div id="connection-status" class="connection-status status-error">
            ⚠ Not connected to server
        </div>
        
        <h2>Stimulus Selection</h2>
        <div class="control-group">
            <label>Stimulus Type</label>
            <select id="stimulus-type">
                <option value="color">Color Baseline Only</option>
                <option value="shape">3D Primitives Only</option>
                <option value="combined" selected>Combined Protocol</option>
            </select>
        </div>
        
        <h2>Timing Parameters</h2>
        <div class="control-group">
            <label>Stimulus Duration (ms)</label>
            <input type="number" id="stim-duration" value="3000" min="500" max="30000" step="100">
        </div>
        <div class="control-group">
            <label>Inter-Stimulus Interval (ms)</label>
            <input type="number" id="isi-duration" value="1000" min="200" max="10000" step="100">
        </div>
        <div class="control-group">
            <label>Repetitions per Stimulus</label>
            <input type="number" id="repetitions" value="3" min="1" max="20">
        </div>
        
        <h2>3D Shape Settings</h2>
        <div class="control-group">
            <label>Rotation Speed (rad/s)</label>
            <input type="number" id="rotation-speed" value="0.5" min="0" max="2" step="0.1">
        </div>
        <div class="control-group">
            <label><input type="checkbox" id="tracking-dots"> Show Tracking Dots</label>
        </div>
        
        <h2>Options</h2>
        <div class="control-group">
            <label><input type="checkbox" id="randomize"> Randomize Trial Order</label>
        </div>
        <div class="control-group">
            <label><input type="checkbox" id="enable-vr"> Enable WebXR (VR Mode)</label>
        </div>
        
        <button id="start-btn">START EXPERIMENT</button>
        <button id="toggle-log" class="secondary">Toggle Event Log</button>
        
        <p class="info-text">
            <strong>Keyboard Controls:</strong><br>
            [SPACE] Pause/Resume | [ESC] Abort | [N] Skip Trial
        </p>
    </div>
    
    <div id="canvas-container"></div>
    
    <div id="status-bar">
        <div class="info">Trial: <span id="trial-num">0</span>/<span id="trial-total">0</span></div>
        <div class="info">Elapsed: <span id="elapsed">0.0</span>s</div>
        <div class="info">Status: <span id="status-text">Running</span></div>
        <div class="info lsl-connected">LSL: <span id="marker-count">0</span> markers</div>
        <div class="progress-bar">
            <div class="progress-fill" id="progress-fill"></div>
        </div>
    </div>
    
    <div id="event-log">
        <div style="border-bottom: 1px solid #333; padding-bottom: 8px; margin-bottom: 8px; color: #888;">
            EVENT LOG
        </div>
        <div id="log-entries"></div>
    </div>
    
    <button id="vr-button">ENTER VR</button>
    <div id="vr-status"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <script>
    // ============================================================
    // CONFIGURATION
    // ============================================================
    const Config = {
        colors: {
            RED:    { hex: 0xff0000, name: 'RED',   code: 'COL_R' },
            GREEN:  { hex: 0x00ff00, name: 'GREEN', code: 'COL_G' },
            BLUE:   { hex: 0x0000ff, name: 'BLUE',  code: 'COL_B' },
            BLACK:  { hex: 0x000000, name: 'BLACK', code: 'COL_K' },
            WHITE:  { hex: 0xffffff, name: 'WHITE', code: 'COL_W' }
        },
        shapes: {
            SPHERE:      { name: 'SPHERE',      code: 'SHP_SPH' },
            CUBE:        { name: 'CUBE',        code: 'SHP_CUB' },
            PYRAMID:     { name: 'PYRAMID',     code: 'SHP_PYR' },
            ICOSAHEDRON: { name: 'ICOSAHEDRON', code: 'SHP_ICO' }
        },
        neutralGray: 0x808080,
        scene: {
            cameraFOV: 50,
            cameraNear: 0.1,
            cameraFar: 1000,
            cameraZ: 5,
            shapeScale: 1.35,
            shapeColor: 0xe0e0e0,
            shapeBackground: 0x000000,
            ambientIntensity: 0.4,
            directionalIntensity: 0.6,
            showTrackingDots: false
        },
        defaults: {
            stimulusDuration: 3000,
            isiDuration: 1000,
            repetitions: 3,
            rotationSpeed: 0.5
        },
        vr: {
            // Distance in front of camera for head-locked stimuli
            stimulusDistance: 2.5,
            // Scale multiplier for VR (shapes may need to be larger)
            scaleMultiplier: 1.0
        }
    };

    // ============================================================
    // HTTP/LSL EVENT LOGGER
    // ============================================================
    const EventLogger = {
        entries: [],
        experimentStartTime: null,
        serverConnected: false,
        markerCount: 0,
        
        async init() {
            this.entries = [];
            this.experimentStartTime = performance.now();
            await this.log('EXPERIMENT_START', { timestamp: Date.now() });
        },
        
        async log(eventType, data = {}) {
            const absoluteTime = performance.now();
            const relativeTime = this.experimentStartTime 
                ? absoluteTime - this.experimentStartTime : 0;
            
            const entry = { eventType, absoluteTime, relativeTime, ...data };
            this.entries.push(entry);
            
            console.log(`[EEG_EVENT] ${eventType}`, {
                absoluteMs: absoluteTime.toFixed(3),
                relativeMs: relativeTime.toFixed(3),
                ...data
            });
            
            this.updateVisualLog(entry);
            await this.sendToServer(entry);
            
            return entry;
        },
        
        async logOnset(stimulusType, stimulusCode, trialNumber) {
            return await this.log('STIM_ONSET', { 
                stimulusType, stimulusCode, trialNumber 
            });
        },
        
        async logOffset(stimulusType, stimulusCode, trialNumber, duration) {
            return await this.log('STIM_OFFSET', { 
                stimulusType, stimulusCode, trialNumber, 
                actualDurationMs: duration.toFixed(3) 
            });
        },
        
        async sendToServer(entry) {
            if (!this.serverConnected) {
                console.warn('[LSL] Server not connected, skipping marker');
                return;
            }
            
            try {
                const response = await fetch('/event', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        eventType: entry.eventType,
                        stimulusCode: entry.stimulusCode || '',
                        trialNumber: entry.trialNumber || 0,
                        relativeTime: entry.relativeTime
                    })
                });
                
                if (response.ok) {
                    const data = await response.json();
                    this.markerCount = data.marker_count;
                    this.updateMarkerCount();
                }
            } catch (error) {
                console.error('[LSL] Failed to send marker:', error);
            }
        },
        
        async checkServerConnection() {
            try {
                const response = await fetch('/status');
                if (response.ok) {
                    this.serverConnected = true;
                    this.updateConnectionStatus(true);
                    const data = await response.json();
                    this.markerCount = data.marker_count;
                    return true;
                }
            } catch (error) {
                this.serverConnected = false;
                this.updateConnectionStatus(false);
            }
            return false;
        },
        
        updateConnectionStatus(connected) {
            const el = document.getElementById('connection-status');
            if (connected) {
                el.className = 'connection-status status-ok';
                el.textContent = '✓ Connected to EEG server (LSL active)';
            } else {
                el.className = 'connection-status status-error';
                el.textContent = '⚠ Not connected to server (run: python eeg_server_with_lsl.py)';
            }
        },
        
        updateMarkerCount() {
            const el = document.getElementById('marker-count');
            if (el) el.textContent = this.markerCount;
        },
        
        updateVisualLog(entry) {
            const container = document.getElementById('log-entries');
            const div = document.createElement('div');
            div.className = 'log-entry';
            
            if (entry.eventType.includes('ONSET')) div.classList.add('log-onset');
            else if (entry.eventType.includes('OFFSET')) div.classList.add('log-offset');
            else div.classList.add('log-system');
            
            const time = entry.relativeTime.toFixed(1).padStart(8, ' ');
            div.textContent = `[${time}ms] ${entry.eventType} ${entry.stimulusCode || ''}`;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        },
        
        exportJSON() {
            return JSON.stringify(this.entries, null, 2);
        }
    };

    // ============================================================
    // STIMULUS FACTORY
    // ============================================================
    const StimulusFactory = {
        createShapeStimulus(shapeType, options = {}) {
            const scale = options.scale || Config.scene.shapeScale;
            let geometry;
            
            switch (shapeType) {
                case 'SPHERE':
                    geometry = new THREE.SphereGeometry(scale, 32, 32);
                    break;
                case 'CUBE':
                    geometry = new THREE.BoxGeometry(scale * 1.6, scale * 1.6, scale * 1.6);
                    break;
                case 'PYRAMID':
                    geometry = new THREE.TetrahedronGeometry(scale * 1.4);
                    break;
                case 'ICOSAHEDRON':
                    geometry = new THREE.IcosahedronGeometry(scale * 1.2);
                    break;
                default:
                    geometry = new THREE.SphereGeometry(scale, 32, 32);
            }
            
            const material = new THREE.MeshStandardMaterial({
                color: Config.scene.shapeColor,
                roughness: 0.7,
                metalness: 0.1
            });
            
            const mesh = new THREE.Mesh(geometry, material);
            mesh.userData = {
                type: 'shape',
                config: Config.shapes[shapeType],
                rotationSpeed: options.rotationSpeed || 0
            };
            
            return mesh;
        },
        
        createLighting() {
            const directionalLight = new THREE.DirectionalLight(0xffffff, Config.scene.directionalIntensity);
            directionalLight.position.set(5, 5, 5);

            return [
                new THREE.AmbientLight(0xffffff, Config.scene.ambientIntensity),
                directionalLight
            ];
        }
    };

    // ============================================================
    // EXPERIMENT CONTROLLER
    // ============================================================
    class ExperimentController {
        constructor() {
            this.isRunning = false;
            this.isPaused = false;
            this.currentTrialIndex = 0;
            this.trialQueue = [];
            this.renderer = null;
            this.scene = null;
            this.camera = null;
            this.currentStimulus = null;
            this.stimulusOnsetTime = null;
            this.lastFrameTime = null;
            this.scheduledTimeout = null;
            this.config = { ...Config.defaults };
            
            // VR state
            this.vrEnabled = false;
            this.vrSupported = false;
            this.xrSession = null;
            this.xrReferenceSpace = null;
            
            // Container for head-locked VR stimuli
            this.vrStimulusContainer = null;
        }
        
        initScene(container) {
            while (container.firstChild) {
                container.removeChild(container.firstChild);
            }
            
            this.renderer = new THREE.WebGLRenderer({ 
                antialias: true,
                alpha: false,
                powerPreference: 'high-performance'
            });
            this.renderer.setSize(window.innerWidth, window.innerHeight);
            this.renderer.setPixelRatio(window.devicePixelRatio);
            this.renderer.outputEncoding = THREE.LinearEncoding;
            container.appendChild(this.renderer.domElement);
            
            this.scene = new THREE.Scene();
            this.scene.background = new THREE.Color(Config.neutralGray);
            
            this.camera = new THREE.PerspectiveCamera(
                Config.scene.cameraFOV,
                window.innerWidth / window.innerHeight,
                Config.scene.cameraNear,
                Config.scene.cameraFar
            );
            this.camera.position.z = Config.scene.cameraZ;
            
            // Create a container for VR head-locked stimuli
            // This will be added to the camera so it moves with the head
            this.vrStimulusContainer = new THREE.Group();
            this.vrStimulusContainer.position.set(0, 0, -Config.vr.stimulusDistance);
            
            StimulusFactory.createLighting().forEach(l => this.scene.add(l));
            
            // Also add lights to the VR container for consistent lighting
            const vrAmbient = new THREE.AmbientLight(0xffffff, Config.scene.ambientIntensity);
            const vrDirectional = new THREE.DirectionalLight(0xffffff, Config.scene.directionalIntensity);
            vrDirectional.position.set(2, 2, 2);
            this.vrStimulusContainer.add(vrAmbient);
            this.vrStimulusContainer.add(vrDirectional);
            
            window.addEventListener('resize', () => {
                if (this.camera && this.renderer && !this.renderer.xr.isPresenting) {
                    this.camera.aspect = window.innerWidth / window.innerHeight;
                    this.camera.updateProjectionMatrix();
                    this.renderer.setSize(window.innerWidth, window.innerHeight);
                }
            });
            
            console.log('[Scene] Initialized');
        }
        
        // ============================================================
        // WEBXR VR SUPPORT - FIXED FOR META QUEST
        // ============================================================
        
        async initWebXR() {
            const vrButton = document.getElementById('vr-button');
            const vrStatus = document.getElementById('vr-status');
            
            // Check if WebXR is available
            if (!navigator.xr) {
                console.warn('[WebXR] Not available in this browser');
                this.showVRStatus('WebXR not available');
                return false;
            }
            
            try {
                // Check for immersive-vr support
                this.vrSupported = await navigator.xr.isSessionSupported('immersive-vr');
                
                if (!this.vrSupported) {
                    console.warn('[WebXR] immersive-vr not supported');
                    this.showVRStatus('VR not supported on this device');
                    return false;
                }
                
                // Enable XR on renderer
                this.renderer.xr.enabled = true;
                
                // Set up the VR button
                vrButton.style.display = 'block';
                vrButton.textContent = 'ENTER VR';
                vrButton.disabled = false;
                
                vrButton.onclick = () => this.toggleVR();
                
                this.vrEnabled = true;
                console.log('[WebXR] VR support enabled');
                this.showVRStatus('VR Ready - Click button to enter');
                
                return true;
                
            } catch (error) {
                console.error('[WebXR] Init error:', error);
                this.showVRStatus('VR init failed: ' + error.message);
                return false;
            }
        }
        
        async toggleVR() {
            const vrButton = document.getElementById('vr-button');
            
            if (this.xrSession) {
                // Exit VR
                await this.exitVR();
            } else {
                // Enter VR
                await this.enterVR();
            }
        }
        
        async enterVR() {
            const vrButton = document.getElementById('vr-button');
            
            try {
                console.log('[WebXR] Requesting VR session...');
                this.showVRStatus('Requesting VR session...');
                vrButton.disabled = true;
                
                // Request session with required features for Quest
                // 'local-floor' gives us a reference space at floor level
                // 'local' is a fallback that should always work
                const sessionInit = {
                    optionalFeatures: ['local-floor', 'bounded-floor', 'hand-tracking'],
                    requiredFeatures: ['local']
                };
                
                this.xrSession = await navigator.xr.requestSession('immersive-vr', sessionInit);
                console.log('[WebXR] Session created:', this.xrSession);
                
                // Set up session end handler
                this.xrSession.addEventListener('end', () => {
                    console.log('[WebXR] Session ended');
                    this.onVRSessionEnd();
                });
                
                // Set the session on the renderer
                await this.renderer.xr.setSession(this.xrSession);
                console.log('[WebXR] Session set on renderer');
                
                // Get reference space (try local-floor first, fall back to local)
                try {
                    this.xrReferenceSpace = await this.xrSession.requestReferenceSpace('local-floor');
                    console.log('[WebXR] Using local-floor reference space');
                } catch (e) {
                    console.log('[WebXR] local-floor not available, using local');
                    this.xrReferenceSpace = await this.xrSession.requestReferenceSpace('local');
                }
                
                // Add camera to scene and attach stimulus container
                if (!this.scene.children.includes(this.camera)) {
                    this.scene.add(this.camera);
                }
                this.camera.add(this.vrStimulusContainer);
                
                vrButton.textContent = 'EXIT VR';
                vrButton.disabled = false;
                this.showVRStatus('VR Active');
                
                console.log('[WebXR] VR session started successfully');
                
            } catch (error) {
                console.error('[WebXR] Failed to enter VR:', error);
                this.showVRStatus('VR Error: ' + error.message);
                vrButton.disabled = false;
                vrButton.textContent = 'ENTER VR';
                this.xrSession = null;
                
                // Show user-friendly error
                alert('Failed to enter VR:\n' + error.message + '\n\nMake sure you\'re using a VR headset and have granted permissions.');
            }
        }
        
        async exitVR() {
            if (this.xrSession) {
                try {
                    await this.xrSession.end();
                } catch (e) {
                    console.warn('[WebXR] Error ending session:', e);
                }
            }
        }
        
        onVRSessionEnd() {
            const vrButton = document.getElementById('vr-button');
            
            this.xrSession = null;
            this.xrReferenceSpace = null;
            
            // Remove stimulus container from camera
            this.camera.remove(this.vrStimulusContainer);
            
            vrButton.textContent = 'ENTER VR';
            vrButton.disabled = false;
            this.showVRStatus('VR Exited');
            
            console.log('[WebXR] VR session cleanup complete');
        }
        
        showVRStatus(message) {
            const vrStatus = document.getElementById('vr-status');
            vrStatus.textContent = message;
            vrStatus.style.display = 'block';
            
            // Auto-hide after 3 seconds for non-error messages
            if (!message.toLowerCase().includes('error')) {
                setTimeout(() => {
                    if (vrStatus.textContent === message) {
                        vrStatus.style.display = 'none';
                    }
                }, 3000);
            }
        }
        
        isInVR() {
            return this.renderer && this.renderer.xr && this.renderer.xr.isPresenting;
        }
        
        // ============================================================
        // TRIAL MANAGEMENT
        // ============================================================
        
        buildTrialQueue(stimType) {
            this.trialQueue = [];
            
            if (stimType === 'color' || stimType === 'combined') {
                for (let r = 0; r < this.config.repetitions; r++) {
                    Object.values(Config.colors).forEach(c => 
                        this.trialQueue.push({ type: 'color', config: c }));
                }
            }
            
            if (stimType === 'shape' || stimType === 'combined') {
                for (let r = 0; r < this.config.repetitions; r++) {
                    Object.keys(Config.shapes).forEach(s => 
                        this.trialQueue.push({ 
                            type: 'shape', 
                            config: Config.shapes[s], 
                            shapeName: s 
                        }));
                }
            }
            
            console.log(`[Experiment] Built ${this.trialQueue.length} trials`);
        }
        
        randomizeTrials() {
            for (let i = this.trialQueue.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [this.trialQueue[i], this.trialQueue[j]] = [this.trialQueue[j], this.trialQueue[i]];
            }
        }
        
        async start() {
            await EventLogger.init();
            this.isRunning = true;
            this.isPaused = false;
            this.currentTrialIndex = 0;
            
            this.showISI();
            this.scheduledTimeout = setTimeout(() => this.startNextTrial(), this.config.isiDuration);
            
            this.lastFrameTime = performance.now();
            this.renderer.setAnimationLoop((time, frame) => this.animate(time, frame));
            
            console.log('[Experiment] Started');
        }
        
        showISI() {
            // Clean up current stimulus
            if (this.currentStimulus?.isMesh) {
                // Remove from both possible parents
                this.scene.remove(this.currentStimulus);
                this.vrStimulusContainer.remove(this.currentStimulus);
                
                // Dispose children
                this.currentStimulus.children.forEach(child => {
                    if (child.geometry) child.geometry.dispose();
                    if (child.material) child.material.dispose();
                });
                
                // Dispose mesh itself
                if (this.currentStimulus.geometry) this.currentStimulus.geometry.dispose();
                if (this.currentStimulus.material) this.currentStimulus.material.dispose();
            }
            
            this.currentStimulus = null;
            this.scene.background = new THREE.Color(Config.neutralGray);
        }
        
        async startNextTrial() {
            if (!this.isRunning || this.isPaused) return;
            if (this.currentTrialIndex >= this.trialQueue.length) {
                await this.end();
                return;
            }
            
            const trial = this.trialQueue[this.currentTrialIndex];
            const inVR = this.isInVR();
            
            if (trial.type === 'color') {
                // Color stimulus - just change background
                this.scene.background = new THREE.Color(trial.config.hex);
                this.currentStimulus = { type: 'color', config: trial.config };
                
            } else {
                // Shape stimulus
                this.scene.background = new THREE.Color(Config.scene.shapeBackground);
                
                const shape = StimulusFactory.createShapeStimulus(trial.shapeName, {
                    rotationSpeed: this.config.rotationSpeed,
                    scale: Config.scene.shapeScale * (inVR ? Config.vr.scaleMultiplier : 1)
                });
                
                if (Config.scene.showTrackingDots) {
                    this.addTrackingDots(shape);
                }
                
                if (inVR) {
                    // In VR: add to the head-locked container
                    shape.position.set(0, 0, 0); // Container is already positioned
                    this.vrStimulusContainer.add(shape);
                    console.log('[VR] Shape added to head-locked container');
                } else {
                    // Not in VR: add to scene normally
                    this.scene.add(shape);
                }
                
                this.currentStimulus = shape;
            }
            
            this.stimulusOnsetTime = performance.now();
            await EventLogger.logOnset(trial.type, trial.config.code, this.currentTrialIndex + 1);
            
            this.updateStatus();
            this.scheduledTimeout = setTimeout(() => this.endCurrentTrial(), this.config.stimulusDuration);
        }
        
        async endCurrentTrial() {
            if (!this.isRunning || !this.currentStimulus) return;
            
            const trial = this.trialQueue[this.currentTrialIndex];
            const duration = performance.now() - this.stimulusOnsetTime;
            
            await EventLogger.logOffset(trial.type, trial.config.code, this.currentTrialIndex + 1, duration);
            
            this.showISI();
            this.currentTrialIndex++;
            this.updateStatus();
            
            this.scheduledTimeout = setTimeout(() => this.startNextTrial(), this.config.isiDuration);
        }
        
        animate(time, xrFrame) {
            if (!this.isRunning) return;
            
            const dt = (time - this.lastFrameTime) / 1000;
            this.lastFrameTime = time;
            
            // Update shape rotation
            if (this.currentStimulus?.isMesh && this.currentStimulus.userData?.rotationSpeed) {
                this.currentStimulus.rotation.y += this.currentStimulus.userData.rotationSpeed * dt;
            }
            
            this.renderer.render(this.scene, this.camera);
        }
        
        updateStatus() {
            document.getElementById('trial-num').textContent = this.currentTrialIndex + 1;
            document.getElementById('trial-total').textContent = this.trialQueue.length;
            document.getElementById('progress-fill').style.width = 
                `${((this.currentTrialIndex + 1) / this.trialQueue.length) * 100}%`;
        }
        
        addTrackingDots(shape) {
            const dotGeometry = new THREE.SphereGeometry(0.05, 8, 8);
            const dotMaterial = new THREE.MeshBasicMaterial({ color: 0x000000 });
            
            shape.geometry.computeBoundingSphere();
            const radius = shape.geometry.boundingSphere.radius * 0.95;
            
            [[radius, 0, 0], [-radius, 0, 0], [0, radius, 0], 
             [0, -radius, 0], [0, 0, radius], [0, 0, -radius]].forEach(pos => {
                const dot = new THREE.Mesh(dotGeometry, dotMaterial);
                dot.position.set(...pos);
                shape.add(dot);
            });
        }
        
        togglePause() {
            if (!this.isRunning) return;
            this.isPaused = !this.isPaused;
            
            if (this.isPaused) {
                clearTimeout(this.scheduledTimeout);
                EventLogger.log('PAUSE');
                document.getElementById('status-text').textContent = 'PAUSED';
            } else {
                EventLogger.log('RESUME');
                document.getElementById('status-text').textContent = 'Running';
                this.startNextTrial();
            }
        }
        
        async skip() {
            if (!this.isRunning || this.isPaused) return;
            clearTimeout(this.scheduledTimeout);
            await EventLogger.log('SKIP', { trial: this.currentTrialIndex });
            await this.endCurrentTrial();
        }
        
        async abort() {
            await EventLogger.log('ABORT', { trial: this.currentTrialIndex });
            await this.end();
        }
        
        async end() {
            this.isRunning = false;
            
            if (this.scheduledTimeout) {
                clearTimeout(this.scheduledTimeout);
                this.scheduledTimeout = null;
            }
            
            if (this.renderer) {
                this.renderer.setAnimationLoop(null);
            }
            
            await EventLogger.log('EXPERIMENT_END', {
                totalTrials: this.trialQueue.length,
                completed: this.currentTrialIndex
            });
            
            document.getElementById('status-text').textContent = 'COMPLETE';
            
            console.log('=== EXPERIMENT COMPLETE ===');
            console.log(EventLogger.exportJSON());
            
            alert(`Experiment Complete!\n\nTotal markers sent: ${EventLogger.markerCount}\nCheck console for full log.`);
            
            this.cleanup();
            document.getElementById('control-panel').classList.remove('hidden');
            document.getElementById('status-bar').style.display = 'none';
        }
        
        cleanup() {
            console.log('[CLEANUP] Starting...');
            
            if (this.renderer) this.renderer.setAnimationLoop(null);
            if (this.scheduledTimeout) {
                clearTimeout(this.scheduledTimeout);
                this.scheduledTimeout = null;
            }
            
            // Exit VR if active
            if (this.xrSession) {
                this.xrSession.end().catch(e => console.warn('Error ending XR session:', e));
            }
            
            // Clean up current stimulus
            if (this.currentStimulus?.isMesh) {
                this.scene?.remove(this.currentStimulus);
                this.vrStimulusContainer?.remove(this.currentStimulus);
                this.currentStimulus.children.forEach(child => {
                    if (child.geometry) child.geometry.dispose();
                    if (child.material) child.material.dispose();
                });
                if (this.currentStimulus.geometry) this.currentStimulus.geometry.dispose();
                if (this.currentStimulus.material) this.currentStimulus.material.dispose();
            }
            
            // Clean up VR stimulus container
            if (this.vrStimulusContainer) {
                this.camera?.remove(this.vrStimulusContainer);
                while (this.vrStimulusContainer.children.length > 0) {
                    const child = this.vrStimulusContainer.children[0];
                    this.vrStimulusContainer.remove(child);
                    if (child.geometry) child.geometry.dispose();
                    if (child.material) child.material.dispose();
                }
            }
            
            // Clean up camera children
            if (this.camera) {
                while (this.camera.children.length > 0) {
                    const child = this.camera.children[0];
                    this.camera.remove(child);
                    if (child.geometry) child.geometry.dispose();
                    if (child.material) child.material.dispose();
                }
            }
            
            // Clean up scene
            if (this.scene) {
                while (this.scene.children.length > 0) {
                    const obj = this.scene.children[0];
                    this.scene.remove(obj);
                    if (obj.geometry) obj.geometry.dispose();
                    if (obj.material) obj.material.dispose();
                }
            }
            
            // Dispose renderer
            if (this.renderer) {
                this.renderer.dispose();
                const canvas = this.renderer.domElement;
                if (canvas?.parentNode) canvas.parentNode.removeChild(canvas);
            }
            
            // Hide VR button
            const vrBtn = document.getElementById('vr-button');
            if (vrBtn) vrBtn.style.display = 'none';
            
            this.renderer = null;
            this.scene = null;
            this.camera = null;
            this.currentStimulus = null;
            this.vrStimulusContainer = null;
            this.isRunning = false;
            this.isPaused = false;
            this.currentTrialIndex = 0;
            this.trialQueue = [];
            this.xrSession = null;
            this.xrReferenceSpace = null;
            
            document.getElementById('log-entries').innerHTML = '';
            console.log('[CLEANUP] Complete');
        }
    }

    // ============================================================
    // MAIN APPLICATION
    // ============================================================
    const controller = new ExperimentController();
    
    // Check server connection on load
    EventLogger.checkServerConnection();
    
    document.getElementById('start-btn').addEventListener('click', async () => {
        // Check connection again
        const connected = await EventLogger.checkServerConnection();
        if (!connected) {
            alert('Cannot connect to EEG server!\n\nMake sure the server is running:\n  python eeg_server_with_lsl.py\n\nThen refresh this page.');
            return;
        }
        
        // Read config
        controller.config.stimulusDuration = parseInt(document.getElementById('stim-duration').value);
        controller.config.isiDuration = parseInt(document.getElementById('isi-duration').value);
        controller.config.repetitions = parseInt(document.getElementById('repetitions').value);
        controller.config.rotationSpeed = parseFloat(document.getElementById('rotation-speed').value);
        
        const stimType = document.getElementById('stimulus-type').value;
        const randomize = document.getElementById('randomize').checked;
        const enableVR = document.getElementById('enable-vr').checked;
        
        Config.scene.showTrackingDots = document.getElementById('tracking-dots').checked;
        
        // Initialize scene
        controller.initScene(document.getElementById('canvas-container'));
        
        // Initialize WebXR if requested
        if (enableVR) {
            const vrReady = await controller.initWebXR();
            if (!vrReady) {
                console.warn('[Main] VR not available, continuing without VR');
            }
        }
        
        controller.buildTrialQueue(stimType);
        if (randomize) controller.randomizeTrials();
        
        // UI
        document.getElementById('control-panel').classList.add('hidden');
        document.getElementById('status-bar').style.display = 'block';
        document.getElementById('trial-total').textContent = controller.trialQueue.length;
        
        // Start experiment
        await controller.start();
    });
    
    document.getElementById('toggle-log').addEventListener('click', () => {
        document.getElementById('event-log').classList.toggle('visible');
    });
    
    // Keyboard controls
    window.addEventListener('keydown', (e) => {
        switch (e.code) {
            case 'Space':
                e.preventDefault();
                controller.togglePause();
                break;
            case 'Escape':
                if (controller.isRunning) controller.abort();
                break;
            case 'KeyN':
                controller.skip();
                break;
        }
    });
    
    // Update elapsed time
    setInterval(() => {
        if (controller.isRunning && EventLogger.experimentStartTime) {
            const elapsed = (performance.now() - EventLogger.experimentStartTime) / 1000;
            document.getElementById('elapsed').textContent = elapsed.toFixed(1);
        }
    }, 100);
    
    window.EEGStimulus = { Config, EventLogger, StimulusFactory, controller };
    console.log('EEG Stimulus Platform v2.1 loaded (HTTP/LSL + WebXR)');
    </script>
</body>
