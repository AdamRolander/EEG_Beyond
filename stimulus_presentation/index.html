<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EEG Stimulus Platform</title>
    <style>
        /* ============================================================
           MINIMAL RESEARCH UI STYLES
           Keep visual clutter to absolute minimum
           ============================================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Courier New', monospace;
            background: #808080; /* Neutral gray */
            overflow: hidden;
        }
        
        /* Control panel - only visible before experiment starts */
        #control-panel {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #1a1a1a;
            color: #e0e0e0;
            padding: 30px;
            border: 1px solid #404040;
            z-index: 1000;
            min-width: 400px;
        }
        
        #control-panel h1 {
            font-size: 16px;
            margin-bottom: 20px;
            border-bottom: 1px solid #404040;
            padding-bottom: 10px;
        }
        
        #control-panel h2 {
            font-size: 14px;
            margin: 15px 0 10px 0;
            color: #a0a0a0;
        }
        
        .control-group {
            margin-bottom: 15px;
        }
        
        label {
            display: block;
            font-size: 12px;
            margin-bottom: 5px;
            color: #808080;
        }
        
        select, input[type="number"] {
            width: 100%;
            padding: 8px;
            background: #2a2a2a;
            border: 1px solid #404040;
            color: #e0e0e0;
            font-family: inherit;
            font-size: 14px;
        }
        
        button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            background: #2a5a2a;
            border: 1px solid #3a7a3a;
            color: #e0e0e0;
            font-family: inherit;
            font-size: 14px;
            cursor: pointer;
        }
        
        button:hover {
            background: #3a7a3a;
        }
        
        button:disabled {
            background: #404040;
            cursor: not-allowed;
        }
        
        /* Canvas container */
        #canvas-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        
        /* Status overlay - minimal info during experiment */
        #status-overlay {
            position: fixed;
            bottom: 10px;
            left: 10px;
            font-size: 11px;
            color: #606060;
            z-index: 100;
            display: none;
        }
        
        /* Hidden during experiment */
        .hidden {
            display: none !important;
        }
        
        /* Event log panel */
        #event-log {
            position: fixed;
            right: 0;
            top: 0;
            width: 350px;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            color: #00ff00;
            font-size: 11px;
            padding: 10px;
            overflow-y: auto;
            z-index: 500;
            display: none;
        }
        
        #event-log.visible {
            display: block;
        }
        
        .log-entry {
            margin-bottom: 2px;
            font-family: 'Courier New', monospace;
        }
        
        .log-onset { color: #00ff00; }
        .log-offset { color: #ff6600; }
        .log-system { color: #666666; }
    </style>
</head>
<body>
    <!-- Control Panel -->
    <div id="control-panel">
        <h1>EEG STIMULUS PLATFORM v1.0</h1>
        
        <h2>Experiment Mode</h2>
        <div class="control-group">
            <label>Stimulus Type</label>
            <select id="stimulus-type">
                <option value="color">Color Baseline</option>
                <option value="shape">3D Primitives</option>
                <option value="combined">Combined Protocol</option>
            </select>
        </div>
        
        <h2>Timing Configuration</h2>
        <div class="control-group">
            <label>Stimulus Duration (ms)</label>
            <input type="number" id="stim-duration" value="3000" min="500" max="30000" step="100">
        </div>
        <div class="control-group">
            <label>Inter-Stimulus Interval (ms)</label>
            <input type="number" id="isi-duration" value="1000" min="200" max="10000" step="100">
        </div>
        <div class="control-group">
            <label>Repetitions per Stimulus</label>
            <input type="number" id="repetitions" value="3" min="1" max="20">
        </div>
        
        <h2>3D Shape Options</h2>
        <div class="control-group">
            <label>Rotation Speed (rad/s)</label>
            <input type="number" id="rotation-speed" value="0.5" min="0" max="2" step="0.1">
        </div>
        <div class="control-group">
            <label>
                <input type="checkbox" id="tracking-dots"> Show Tracking Dots (for pilot testing)
            </label>
        </div>
        
        <h2>WebXR</h2>
        <div class="control-group">
            <label>
                <input type="checkbox" id="enable-vr"> Enable VR Mode
            </label>
        </div>
        
        <button id="start-btn">START EXPERIMENT</button>
        <button id="toggle-log-btn" style="background: #2a2a5a; border-color: #3a3a7a;">Toggle Event Log</button>
        
        <p style="margin-top: 15px; font-size: 11px; color: #606060;">
            Controls: [SPACE] Pause/Resume | [ESC] Abort | [N] Next Stimulus
        </p>
    </div>
    
    <!-- Canvas Container -->
    <div id="canvas-container"></div>
    
    <!-- Status Overlay -->
    <div id="status-overlay">
        Trial: <span id="trial-counter">0/0</span> | 
        Time: <span id="elapsed-time">0.00</span>s
    </div>
    
    <!-- Event Log -->
    <div id="event-log">
        <div style="border-bottom: 1px solid #333; padding-bottom: 5px; margin-bottom: 10px;">
            EVENT LOG (for EEG marker integration)
        </div>
        <div id="log-entries"></div>
    </div>
    
    <!-- Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    
    <script>
    /* ============================================================
       EEG STIMULUS PLATFORM
       
       A research-grade visual stimulus generator for EEG studies.
       Built with Three.js for precise timing and WebXR support.
       
       Author: Research Engineering
       Version: 1.0
       ============================================================ */

    // ============================================================
    // CONFIGURATION MODULE
    // Central configuration for all experiment parameters
    // ============================================================
    const Config = {
        // Color stimuli - pure sRGB primaries
        colors: {
            RED:    { hex: 0xff0000, name: 'RED',   code: 'COL_R' },
            GREEN:  { hex: 0x00ff00, name: 'GREEN', code: 'COL_G' },
            BLUE:   { hex: 0x0000ff, name: 'BLUE',  code: 'COL_B' },
            BLACK:  { hex: 0x000000, name: 'BLACK', code: 'COL_K' },
            WHITE:  { hex: 0xffffff, name: 'WHITE', code: 'COL_W' }
        },
        
        // Shape stimuli
        shapes: {
            SPHERE:      { name: 'SPHERE',      code: 'SHP_SPH' },
            CUBE:        { name: 'CUBE',        code: 'SHP_CUB' },
            PYRAMID:     { name: 'PYRAMID',     code: 'SHP_PYR' },
            ICOSAHEDRON: { name: 'ICOSAHEDRON', code: 'SHP_ICO' }
        },
        
        // Neutral gray for ISI (inter-stimulus interval)
        neutralGray: 0x808080,
        
        // Default timing (can be overridden by UI)
        defaults: {
            stimulusDuration: 3000,  // ms
            isiDuration: 1000,       // ms
            repetitions: 3,
            rotationSpeed: 0.5       // rad/s
        },
        
        // 3D scene parameters
        scene: {
            cameraFOV: 50,
            cameraNear: 0.1,
            cameraFar: 1000,
            cameraZ: 5,
            shapeScale: 1.35,           // ~10% smaller than original 1.5
            shapeColor: 0xe0e0e0,       // Light gray
            shapeBackground: 0x000000,  // Black background for shape stimuli
            ambientIntensity: 0.4,
            directionalIntensity: 0.6,
            showTrackingDots: false     // Optional rotation tracking markers
        }
    };

    // ============================================================
    // EVENT LOGGER MODULE
    // Handles all timing events with precision timestamps
    // Structured for easy EEG marker integration
    // ============================================================
    const EventLogger = {
        entries: [],
        experimentStartTime: null,
        
        /**
         * Initialize logger at experiment start
         */
        init() {
            this.entries = [];
            this.experimentStartTime = performance.now();
            this.log('EXPERIMENT_START', { timestamp: Date.now() });
        },
        
        /**
         * Log an event with precise timing
         * @param {string} eventType - Event type identifier
         * @param {object} data - Additional event data
         */
        log(eventType, data = {}) {
            const absoluteTime = performance.now();
            const relativeTime = this.experimentStartTime 
                ? absoluteTime - this.experimentStartTime 
                : 0;
            
            const entry = {
                eventType,
                absoluteTime,
                relativeTime,
                ...data
            };
            
            this.entries.push(entry);
            
            // Console output for debugging/external capture
            console.log(`[EEG_EVENT] ${eventType}`, {
                absoluteMs: absoluteTime.toFixed(3),
                relativeMs: relativeTime.toFixed(3),
                ...data
            });
            
            // Update visual log
            this.updateVisualLog(entry);
            
            // INTEGRATION POINT: Send to external systems
            // this.sendToLSL(entry);      // Lab Streaming Layer
            // this.sendToWebSocket(entry); // WebSocket bridge
            // this.sendToParallelPort(entry); // Hardware trigger
            
            return entry;
        },
        
        /**
         * Log stimulus onset
         */
        logOnset(stimulusType, stimulusCode, trialNumber) {
            return this.log('STIM_ONSET', {
                stimulusType,
                stimulusCode,
                trialNumber
            });
        },
        
        /**
         * Log stimulus offset
         */
        logOffset(stimulusType, stimulusCode, trialNumber, duration) {
            return this.log('STIM_OFFSET', {
                stimulusType,
                stimulusCode,
                trialNumber,
                actualDurationMs: duration.toFixed(3)
            });
        },
        
        /**
         * Update the visual event log panel
         */
        updateVisualLog(entry) {
            const logContainer = document.getElementById('log-entries');
            const div = document.createElement('div');
            div.className = 'log-entry';
            
            if (entry.eventType.includes('ONSET')) {
                div.classList.add('log-onset');
            } else if (entry.eventType.includes('OFFSET')) {
                div.classList.add('log-offset');
            } else {
                div.classList.add('log-system');
            }
            
            const timeStr = entry.relativeTime.toFixed(1).padStart(8, ' ');
            div.textContent = `[${timeStr}ms] ${entry.eventType} ${entry.stimulusCode || ''}`;
            
            logContainer.appendChild(div);
            logContainer.scrollTop = logContainer.scrollHeight;
        },
        
        /**
         * Export all logged events as JSON
         */
        export() {
            return JSON.stringify(this.entries, null, 2);
        },
        
        // --------------------------------------------------------
        // INTEGRATION STUBS
        // Uncomment and implement for your EEG system
        // --------------------------------------------------------
        
        /*
        sendToLSL(entry) {
            // Lab Streaming Layer integration
            // Requires LSL WebSocket bridge running locally
            if (window.lslOutlet) {
                window.lslOutlet.push_sample([entry.eventType, entry.absoluteTime]);
            }
        },
        
        sendToWebSocket(entry) {
            // Generic WebSocket bridge
            if (window.eegSocket && window.eegSocket.readyState === WebSocket.OPEN) {
                window.eegSocket.send(JSON.stringify(entry));
            }
        },
        
        sendToParallelPort(entry) {
            // Parallel port trigger via local bridge
            // Encode event type as trigger code
            const triggerCodes = {
                'STIM_ONSET': 1,
                'STIM_OFFSET': 2,
                'COL_R': 10, 'COL_G': 11, 'COL_B': 12,
                'COL_K': 13, 'COL_W': 14,
                'SHP_SPH': 20, 'SHP_CUB': 21, 
                'SHP_PYR': 22, 'SHP_ICO': 23
            };
            const code = triggerCodes[entry.stimulusCode] || 0;
            // Send via your parallel port bridge
        }
        */
    };

    // ============================================================
    // STIMULUS FACTORY MODULE
    // Creates and manages visual stimuli
    // ============================================================
    const StimulusFactory = {
        /**
         * Create a full-screen color stimulus
         * Uses a plane that fills the entire view
         */
        createColorStimulus(colorConfig) {
            // Disable Three.js color management for accurate sRGB
            THREE.ColorManagement.enabled = false;
            
            const geometry = new THREE.PlaneGeometry(100, 100);
            const material = new THREE.MeshBasicMaterial({
                color: colorConfig.hex,
                side: THREE.DoubleSide
            });
            
            const mesh = new THREE.Mesh(geometry, material);
            mesh.position.z = -10; // Behind camera near plane
            
            mesh.userData = {
                type: 'color',
                config: colorConfig
            };
            
            return mesh;
        },
        
        /**
         * Create a 3D primitive shape
         */
        createShapeStimulus(shapeType) {
            let geometry;
            
            switch (shapeType) {
                case 'SPHERE':
                    geometry = new THREE.SphereGeometry(
                        Config.scene.shapeScale, 
                        32, 32  // Sufficient segments for smooth appearance
                    );
                    break;
                    
                case 'CUBE':
                    geometry = new THREE.BoxGeometry(
                        Config.scene.shapeScale * 1.6,
                        Config.scene.shapeScale * 1.6,
                        Config.scene.shapeScale * 1.6
                    );
                    break;
                    
                case 'PYRAMID':
                    // Tetrahedron as pyramid
                    geometry = new THREE.TetrahedronGeometry(
                        Config.scene.shapeScale * 1.4
                    );
                    break;
                    
                case 'ICOSAHEDRON':
                    geometry = new THREE.IcosahedronGeometry(
                        Config.scene.shapeScale * 1.2
                    );
                    break;
                    
                default:
                    console.warn(`Unknown shape type: ${shapeType}`);
                    geometry = new THREE.SphereGeometry(1, 32, 32);
            }
            
            // Simple material - no textures
            const material = new THREE.MeshStandardMaterial({
                color: Config.scene.shapeColor,
                roughness: 0.7,
                metalness: 0.1
            });
            
            const mesh = new THREE.Mesh(geometry, material);
            
            mesh.userData = {
                type: 'shape',
                config: Config.shapes[shapeType],
                rotationAxis: 'y',  // Rotate around Y only
                rotationSpeed: 0   // Set by experiment controller
            };
            
            return mesh;
        },
        
        /**
         * Create basic lighting setup
         * Minimal complexity - just ambient + one directional
         */
        createLighting() {
            const lights = [];
            
            // Ambient light for base illumination
            const ambient = new THREE.AmbientLight(
                0xffffff, 
                Config.scene.ambientIntensity
            );
            lights.push(ambient);
            
            // Single directional light
            const directional = new THREE.DirectionalLight(
                0xffffff,
                Config.scene.directionalIntensity
            );
            directional.position.set(5, 5, 5);
            lights.push(directional);
            
            return lights;
        }
    };

    // ============================================================
    // EXPERIMENT CONTROLLER
    // Main experiment state machine and timing control
    // ============================================================
    const ExperimentController = {
        // State
        isRunning: false,
        isPaused: false,
        currentTrialIndex: 0,
        trialQueue: [],
        
        // Three.js objects
        renderer: null,
        scene: null,
        camera: null,
        currentStimulus: null,
        vrButton: null,
        
        // Timing
        stimulusOnsetTime: null,
        lastFrameTime: null,
        scheduledTimeout: null,
        
        // Configuration (from UI)
        config: {
            stimulusDuration: 3000,
            isiDuration: 1000,
            repetitions: 3,
            rotationSpeed: 0.5,
            enableVR: false,
            stimulusType: 'color'
        },
        
        /**
         * Initialize Three.js scene and renderer
         */
        initScene() {
            const container = document.getElementById('canvas-container');
            
            // Remove any existing canvases (safety check)
            while (container.firstChild) {
                container.removeChild(container.firstChild);
            }
            
            // Create renderer
            this.renderer = new THREE.WebGLRenderer({
                antialias: true,
                powerPreference: 'high-performance'
            });
            this.renderer.setSize(window.innerWidth, window.innerHeight);
            this.renderer.setPixelRatio(window.devicePixelRatio);
            
            // Disable automatic color space conversion for accurate colors
            this.renderer.outputEncoding = THREE.LinearEncoding;
            
            container.appendChild(this.renderer.domElement);
            
            // Create scene
            this.scene = new THREE.Scene();
            this.scene.background = new THREE.Color(Config.neutralGray);
            
            // Create camera
            this.camera = new THREE.PerspectiveCamera(
                Config.scene.cameraFOV,
                window.innerWidth / window.innerHeight,
                Config.scene.cameraNear,
                Config.scene.cameraFar
            );
            this.camera.position.z = Config.scene.cameraZ;
            
            // Add lighting (needed for 3D shapes)
            const lights = StimulusFactory.createLighting();
            lights.forEach(light => this.scene.add(light));
            
            // Set up event listeners (only once)
            if (!this._listenersInitialized) {
                this._resizeHandler = () => this.onWindowResize();
                this._keyHandler = (e) => this.onKeyDown(e);
                window.addEventListener('resize', this._resizeHandler);
                window.addEventListener('keydown', this._keyHandler);
                this._listenersInitialized = true;
            }
            
            console.log('[INIT] Three.js scene initialized');
        },
        
        /**
         * Initialize WebXR if enabled
         */
        async initWebXR() {
            if (!this.config.enableVR) return false;
            
            // Check WebXR support
            if (!navigator.xr) {
                console.warn('[WebXR] Not supported in this browser');
                return false;
            }
            
            const isSupported = await navigator.xr.isSessionSupported('immersive-vr');
            if (!isSupported) {
                console.warn('[WebXR] Immersive VR not supported');
                return false;
            }
            
            // Enable XR on renderer
            this.renderer.xr.enabled = true;
            
            // Create VR button
            this.createVRButton();
            
            console.log('[WebXR] VR mode enabled');
            return true;
        },
        
        /**
         * Create VR entry button (simplified VRButton)
         */
        createVRButton() {
            const button = document.createElement('button');
            button.id = 'vr-button';
            button.textContent = 'ENTER VR';
            button.style.cssText = `
                position: fixed;
                bottom: 20px;
                left: 50%;
                transform: translateX(-50%);
                padding: 15px 30px;
                background: #2a2a5a;
                border: 1px solid #4a4a8a;
                color: #e0e0e0;
                font-family: 'Courier New', monospace;
                font-size: 14px;
                cursor: pointer;
                z-index: 1000;
            `;
            
            button.onclick = async () => {
                const session = await navigator.xr.requestSession('immersive-vr', {
                    optionalFeatures: ['local-floor', 'bounded-floor']
                });
                
                this.renderer.xr.setSession(session);
                button.textContent = 'VR ACTIVE';
                button.disabled = true;
                
                session.addEventListener('end', () => {
                    button.textContent = 'ENTER VR';
                    button.disabled = false;
                });
            };
            
            document.body.appendChild(button);
            this.vrButton = button;
        },
        
        /**
         * Build the trial queue based on experiment configuration
         */
        buildTrialQueue() {
            this.trialQueue = [];
            
            if (this.config.stimulusType === 'color' || 
                this.config.stimulusType === 'combined') {
                // Add color trials
                const colors = Object.values(Config.colors);
                for (let rep = 0; rep < this.config.repetitions; rep++) {
                    colors.forEach(color => {
                        this.trialQueue.push({
                            type: 'color',
                            config: color
                        });
                    });
                }
            }
            
            if (this.config.stimulusType === 'shape' || 
                this.config.stimulusType === 'combined') {
                // Add shape trials
                const shapes = Object.keys(Config.shapes);
                for (let rep = 0; rep < this.config.repetitions; rep++) {
                    shapes.forEach(shape => {
                        this.trialQueue.push({
                            type: 'shape',
                            config: Config.shapes[shape],
                            shapeName: shape
                        });
                    });
                }
            }
            
            console.log(`[QUEUE] Built ${this.trialQueue.length} trials`);
        },
        
        /**
         * Read configuration from UI
         */
        readConfigFromUI() {
            this.config.stimulusType = document.getElementById('stimulus-type').value;
            this.config.stimulusDuration = parseInt(document.getElementById('stim-duration').value);
            this.config.isiDuration = parseInt(document.getElementById('isi-duration').value);
            this.config.repetitions = parseInt(document.getElementById('repetitions').value);
            this.config.rotationSpeed = parseFloat(document.getElementById('rotation-speed').value);
            this.config.enableVR = document.getElementById('enable-vr').checked;
            
            // Update global config for tracking dots
            Config.scene.showTrackingDots = document.getElementById('tracking-dots').checked;
        },
        
        /**
         * Start the experiment
         */
        async start() {
            // Read configuration
            this.readConfigFromUI();
            
            // Initialize scene
            this.initScene();
            
            // Initialize WebXR if enabled
            if (this.config.enableVR) {
                await this.initWebXR();
            }
            
            // Build trial queue
            this.buildTrialQueue();
            
            // Hide control panel, show status
            document.getElementById('control-panel').classList.add('hidden');
            document.getElementById('status-overlay').style.display = 'block';
            
            // Initialize logger
            EventLogger.init();
            
            // Start experiment
            this.isRunning = true;
            this.currentTrialIndex = 0;
            
            // Initial ISI before first stimulus
            this.showISI();
            this.scheduledTimeout = setTimeout(() => this.startNextTrial(), this.config.isiDuration);
            
            // Start render loop
            this.lastFrameTime = performance.now();
            this.renderer.setAnimationLoop((time) => this.animate(time));
            
            console.log('[EXPERIMENT] Started');
        },
        
        /**
         * Show inter-stimulus interval (neutral gray)
         */
        showISI() {
            // Remove current stimulus properly
            if (this.currentStimulus) {
                if (this.currentStimulus.isMesh) {
                    // Remove from scene
                    this.scene.remove(this.currentStimulus);
                    // Also remove from camera (VR mode)
                    this.camera.remove(this.currentStimulus);
                    
                    // Dispose of tracking dot children if present
                    this.currentStimulus.children.forEach(child => {
                        if (child.geometry) child.geometry.dispose();
                        if (child.material) child.material.dispose();
                    });
                    
                    // Dispose of main geometry/material
                    if (this.currentStimulus.geometry) {
                        this.currentStimulus.geometry.dispose();
                    }
                    if (this.currentStimulus.material) {
                        this.currentStimulus.material.dispose();
                    }
                }
                this.currentStimulus = null;
            }
            
            // Set background to neutral gray
            this.scene.background = new THREE.Color(Config.neutralGray);
        },
        
        /**
         * Start the next trial
         */
        startNextTrial() {
            if (!this.isRunning || this.isPaused) return;
            
            if (this.currentTrialIndex >= this.trialQueue.length) {
                this.endExperiment();
                return;
            }
            
            const trial = this.trialQueue[this.currentTrialIndex];
            
            // Create stimulus
            if (trial.type === 'color') {
                this.showColorStimulus(trial.config);
            } else if (trial.type === 'shape') {
                this.showShapeStimulus(trial.shapeName);
            }
            
            // Log onset
            this.stimulusOnsetTime = performance.now();
            EventLogger.logOnset(
                trial.type,
                trial.config.code,
                this.currentTrialIndex + 1
            );
            
            // Update status display
            document.getElementById('trial-counter').textContent = 
                `${this.currentTrialIndex + 1}/${this.trialQueue.length}`;
            
            // Schedule offset
            this.scheduledTimeout = setTimeout(() => this.endCurrentTrial(), this.config.stimulusDuration);
        },
        
        /**
         * Show a color stimulus
         */
        showColorStimulus(colorConfig) {
            // For color stimuli, just change background
            this.scene.background = new THREE.Color(colorConfig.hex);
            
            // Store reference for logging
            this.currentStimulus = { 
                userData: { 
                    type: 'color', 
                    config: colorConfig 
                } 
            };
        },
        
        /**
         * Show a 3D shape stimulus
         */
        showShapeStimulus(shapeName) {
            // Set background to black for shape viewing (better contrast)
            this.scene.background = new THREE.Color(Config.scene.shapeBackground);
            
            // Create shape
            const shape = StimulusFactory.createShapeStimulus(shapeName);
            shape.userData.rotationSpeed = this.config.rotationSpeed;
            
            // Add tracking dots if enabled
            if (Config.scene.showTrackingDots) {
                this.addTrackingDots(shape);
            }
            
            // For VR: parent to camera to keep head-locked
            if (this.config.enableVR && this.renderer.xr.isPresenting) {
                // In VR, position relative to camera
                shape.position.set(0, 0, -3);
                this.camera.add(shape);
                this.scene.add(this.camera);
            } else {
                // Desktop: center in scene
                shape.position.set(0, 0, 0);
                this.scene.add(shape);
            }
            
            this.currentStimulus = shape;
        },
        
        /**
         * Add tracking dots to a shape for rotation visualization
         * These are small black spheres at cardinal points
         */
        addTrackingDots(shape) {
            const dotGeometry = new THREE.SphereGeometry(0.05, 8, 8);
            const dotMaterial = new THREE.MeshBasicMaterial({ color: 0x000000 });
            
            // Get bounding sphere to place dots at surface
            shape.geometry.computeBoundingSphere();
            const radius = shape.geometry.boundingSphere.radius * 0.95;
            
            // Add dots at key positions
            const positions = [
                [radius, 0, 0],      // +X
                [-radius, 0, 0],     // -X
                [0, radius, 0],      // +Y
                [0, -radius, 0],     // -Y
                [0, 0, radius],      // +Z
                [0, 0, -radius]      // -Z
            ];
            
            positions.forEach(pos => {
                const dot = new THREE.Mesh(dotGeometry, dotMaterial);
                dot.position.set(...pos);
                shape.add(dot);  // Parent to shape so dots rotate with it
            });
        },
        
        /**
         * End the current trial
         */
        endCurrentTrial() {
            if (!this.isRunning || !this.currentStimulus) return;
            
            const trial = this.trialQueue[this.currentTrialIndex];
            const duration = performance.now() - this.stimulusOnsetTime;
            
            // Log offset
            EventLogger.logOffset(
                trial.type,
                trial.config.code,
                this.currentTrialIndex + 1,
                duration
            );
            
            // Show ISI
            this.showISI();
            
            // Advance to next trial
            this.currentTrialIndex++;
            
            // Schedule next trial after ISI
            this.scheduledTimeout = setTimeout(() => this.startNextTrial(), this.config.isiDuration);
        },
        
        /**
         * Animation loop
         */
        animate(time) {
            if (!this.isRunning) return;
            
            // Calculate delta time for consistent rotation
            const deltaTime = (time - this.lastFrameTime) / 1000;
            this.lastFrameTime = time;
            
            // Update elapsed time display
            if (EventLogger.experimentStartTime) {
                const elapsed = (time - EventLogger.experimentStartTime) / 1000;
                document.getElementById('elapsed-time').textContent = elapsed.toFixed(2);
            }
            
            // Rotate shape if present
            if (this.currentStimulus && 
                this.currentStimulus.userData && 
                this.currentStimulus.userData.type === 'shape') {
                
                const speed = this.currentStimulus.userData.rotationSpeed;
                this.currentStimulus.rotation.y += speed * deltaTime;
            }
            
            // Render
            this.renderer.render(this.scene, this.camera);
        },
        
        /**
         * End the experiment
         */
        endExperiment() {
            this.isRunning = false;
            
            // Clear any pending timeouts
            if (this.scheduledTimeout) {
                clearTimeout(this.scheduledTimeout);
                this.scheduledTimeout = null;
            }
            
            EventLogger.log('EXPERIMENT_END', {
                totalTrials: this.trialQueue.length,
                completedTrials: this.currentTrialIndex
            });
            
            // Stop render loop
            if (this.renderer) {
                this.renderer.setAnimationLoop(null);
            }
            
            // Export log to console
            console.log('=== EXPERIMENT LOG ===');
            console.log(EventLogger.export());
            
            // Show completion message
            alert('Experiment complete!\n\nCheck console for event log export.');
            
            // Clean up and reset for potential re-run
            this.cleanup();
            
            // Reset UI
            document.getElementById('control-panel').classList.remove('hidden');
            document.getElementById('status-overlay').style.display = 'none';
        },
        
        /**
         * Clean up Three.js resources for re-run
         */
        cleanup() {
            console.log('[CLEANUP] Starting cleanup...');
            
            // Stop any running animation loop first
            if (this.renderer) {
                this.renderer.setAnimationLoop(null);
            }
            
            // Clear any pending timeouts
            if (this.scheduledTimeout) {
                clearTimeout(this.scheduledTimeout);
                this.scheduledTimeout = null;
            }
            
            // Remove current stimulus with full disposal
            if (this.currentStimulus) {
                if (this.currentStimulus.isMesh) {
                    this.scene?.remove(this.currentStimulus);
                    this.camera?.remove(this.currentStimulus);
                    
                    // Dispose children (tracking dots)
                    this.currentStimulus.children.forEach(child => {
                        if (child.geometry) child.geometry.dispose();
                        if (child.material) child.material.dispose();
                    });
                    
                    if (this.currentStimulus.geometry) {
                        this.currentStimulus.geometry.dispose();
                    }
                    if (this.currentStimulus.material) {
                        this.currentStimulus.material.dispose();
                    }
                }
                this.currentStimulus = null;
            }
            
            // Clear camera children
            if (this.camera) {
                while (this.camera.children.length > 0) {
                    const child = this.camera.children[0];
                    this.camera.remove(child);
                    if (child.geometry) child.geometry.dispose();
                    if (child.material) child.material.dispose();
                }
            }
            
            // Dispose of all scene objects
            if (this.scene) {
                while (this.scene.children.length > 0) {
                    const obj = this.scene.children[0];
                    this.scene.remove(obj);
                    if (obj.geometry) obj.geometry.dispose();
                    if (obj.material) obj.material.dispose();
                }
            }
            
            // Dispose of renderer and remove canvas
            if (this.renderer) {
                this.renderer.dispose();
                const canvas = this.renderer.domElement;
                if (canvas && canvas.parentNode) {
                    canvas.parentNode.removeChild(canvas);
                }
            }
            
            // Remove VR button if present
            if (this.vrButton && this.vrButton.parentNode) {
                this.vrButton.parentNode.removeChild(this.vrButton);
                this.vrButton = null;
            }
            
            // Null out Three.js objects
            this.renderer = null;
            this.scene = null;
            this.camera = null;
            
            // Reset experiment state
            this.isRunning = false;
            this.isPaused = false;
            this.currentTrialIndex = 0;
            this.trialQueue = [];
            this.stimulusOnsetTime = null;
            this.lastFrameTime = null;
            
            // Clear event log display
            document.getElementById('log-entries').innerHTML = '';
            
            console.log('[CLEANUP] Complete - ready for re-run');
        },
        
        /**
         * Handle window resize
         */
        onWindowResize() {
            if (!this.camera || !this.renderer) return;
            
            this.camera.aspect = window.innerWidth / window.innerHeight;
            this.camera.updateProjectionMatrix();
            this.renderer.setSize(window.innerWidth, window.innerHeight);
        },
        
        /**
         * Handle keyboard input
         */
        onKeyDown(event) {
            switch (event.code) {
                case 'Space':
                    // Pause/Resume
                    if (this.isRunning) {
                        this.isPaused = !this.isPaused;
                        EventLogger.log(this.isPaused ? 'PAUSE' : 'RESUME');
                        console.log(this.isPaused ? '[PAUSED]' : '[RESUMED]');
                    }
                    event.preventDefault();
                    break;
                    
                case 'Escape':
                    // Abort experiment
                    if (this.isRunning) {
                        EventLogger.log('ABORT', { 
                            reason: 'user_escape',
                            trialIndex: this.currentTrialIndex 
                        });
                        this.endExperiment();
                    }
                    break;
                    
                case 'KeyN':
                    // Skip to next stimulus (for testing)
                    if (this.isRunning && !this.isPaused) {
                        EventLogger.log('SKIP', { 
                            trialIndex: this.currentTrialIndex 
                        });
                        this.endCurrentTrial();
                    }
                    break;
            }
        }
    };

    // ============================================================
    // UI EVENT HANDLERS
    // ============================================================
    document.addEventListener('DOMContentLoaded', () => {
        // Start button
        document.getElementById('start-btn').addEventListener('click', () => {
            ExperimentController.start();
        });
        
        // Toggle event log
        document.getElementById('toggle-log-btn').addEventListener('click', () => {
            document.getElementById('event-log').classList.toggle('visible');
        });
    });

    // ============================================================
    // EXTENSION API
    // Functions to make it easy to extend the stimulus set
    // ============================================================
    
    /**
     * Add a custom color stimulus
     * @param {string} name - Unique identifier
     * @param {number} hex - Hex color value (e.g., 0xff00ff)
     * @param {string} code - Short code for event logging
     */
    function addCustomColor(name, hex, code) {
        Config.colors[name] = { hex, name, code };
        console.log(`[CONFIG] Added custom color: ${name}`);
    }
    
    /**
     * Add a custom shape stimulus
     * @param {string} name - Unique identifier
     * @param {THREE.BufferGeometry} geometry - Three.js geometry
     * @param {string} code - Short code for event logging
     */
    function addCustomShape(name, geometry, code) {
        Config.shapes[name] = { name, code, customGeometry: geometry };
        console.log(`[CONFIG] Added custom shape: ${name}`);
    }
    
    /**
     * Add an auditory cue (stub for future implementation)
     * @param {string} name - Cue identifier
     * @param {string} audioUrl - Path to audio file
     */
    function addAuditoryCue(name, audioUrl) {
        // Stub for future auditory stimulus support
        console.log(`[CONFIG] Auditory cue registered: ${name} -> ${audioUrl}`);
        // Implementation would use Web Audio API
    }
    
    // Expose API globally for console access
    window.EEGStimulus = {
        Config,
        EventLogger,
        StimulusFactory,
        ExperimentController,
        addCustomColor,
        addCustomShape,
        addAuditoryCue
    };
    
    console.log('=== EEG STIMULUS PLATFORM LOADED ===');
    console.log('Access API via window.EEGStimulus');
    </script>
